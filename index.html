  <!-- Marker SVG global untuk diagram UML (dirujuk dari tiap diagram via url(#..)).
       Warnanya dikontrol CSS mengikuti tema gelap/terang. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <!-- Panah penuh (arah asosiasi, dependensi, transisi) -->
      <marker id="u-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" class="u-arw-fill"/>
      </marker>
      <!-- Panah terbuka (V) untuk beberapa notasi -->
      <marker id="u-arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M1,1 L9,5 L1,9" class="u-arw-stroke" fill="none"/>
      </marker>
      <!-- Wajik penuh = komposisi (whole) -->
      <marker id="u-diamond-fill" viewBox="0 0 12 10" refX="1" refY="5" markerWidth="12" markerHeight="10" orient="auto">
        <path d="M1,5 L6,1 L11,5 L6,9 z" class="u-arw-fill"/>
      </marker>
      <!-- Wajik terbuka = agregasi (whole) -->
      <marker id="u-diamond-open" viewBox="0 0 12 10" refX="1" refY="5" markerWidth="12" markerHeight="10" orient="auto">
        <path d="M1,5 L6,1 L11,5 L6,9 z" class="u-arw-stroke" fill="none"/>
      </marker>
      <!-- Segitiga terbuka = generalization / inheritance / realization -->
      <marker id="u-triangle" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
        <path d="M0,0 L12,6 L0,12 z" class="u-arw-stroke" fill="var(--card)"/>
      </marker>
      <!-- Lingkaran terbuka (port / ball) untuk interface -->
      <marker id="u-circle" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
        <circle cx="5" cy="5" r="4" class="u-arw-stroke" fill="var(--card)"/>
      </marker>
    </defs>
  </svg>
