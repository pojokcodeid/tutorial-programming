# nginx-lab — gateway Nginx + 3 backend statis
# Jalankan dari folder ini:
#   podman compose up -d     (atau: podman-compose up -d)
#
# Hanya memakai gambar resmi docker.io/library/nginx:alpine.
services:
  nginx-lab:
    image: docker.io/library/nginx:alpine
    container_name: nginx-lab
    ports:
      - "8080:8080"   # HTTP gateway
      - "8081:8081"   # redirect HTTP -> HTTPS (lab)
      - "8443:8443"   # HTTPS gateway
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./web:/usr/share/nginx/html:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3

  backend-1:
    image: docker.io/library/nginx:alpine
    container_name: backend-1
    hostname: backend-1
    volumes:
      - ./backends/backend-1:/usr/share/nginx/html:ro
      - ./backends/backend.conf:/etc/nginx/conf.d/default.conf:ro

  backend-2:
    image: docker.io/library/nginx:alpine
    container_name: backend-2
    hostname: backend-2
    volumes:
      - ./backends/backend-2:/usr/share/nginx/html:ro
      - ./backends/backend.conf:/etc/nginx/conf.d/default.conf:ro

  backend-3:
    image: docker.io/library/nginx:alpine
    container_name: backend-3
    hostname: backend-3
    volumes:
      - ./backends/backend-3:/usr/share/nginx/html:ro
      - ./backends/backend.conf:/etc/nginx/conf.d/default.conf:ro
