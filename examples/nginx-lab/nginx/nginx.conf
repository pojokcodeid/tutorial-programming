# ============================================================
# nginx-lab — konfigurasi utama
# Konteks: main -> events -> http (include conf.d & snippets)
# ============================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Custom log format (pelajaran logging & troubleshooting) ---
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" '
                      'rt=$request_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;

    gzip         on;
    gzip_types   text/plain text/css application/javascript application/json image/svg+xml;

    server_tokens  off;

    # --- Rate limiting -------------------------------------------------
    # limit_req_zone HANYA boleh di konteks http (bukan server/location).
    # Zone gw_rate dipakai oleh limit_req di snippets/proxy-routes.conf.
    limit_req_zone  $binary_remote_addr  zone=gw_rate:10m  rate=10r/s;

    # --- Snippet global -------------------------------------------------
    # add_header di context http diwariskan ke semua server/location,
    # kecuali level tersebut mendefinisikan add_header-nya sendiri.
    include /etc/nginx/snippets/security-headers.conf;

    # --- Virtual host (app.local, api.local, docs.local, redirect) ------
    include /etc/nginx/conf.d/*.conf;
}
