# ============================================================
# Virtual host utama: app.local (static website + SPA fallback)
# - server 1: port 8080 (HTTP, default_server)
# - server 2: port 8443 (HTTPS)
# - server 3: port 8081 (hanya redirect ke HTTPS, untuk lab)
# Route di dua server pertama sengaja ditulis sama agar mudah
# dibandingkan; pola aslinya di produksi: 80 -> 443.
# ============================================================

# --- HTTP :8080 ---------------------------------------------
server {
    listen       8080 default_server;
    server_name  app.local;

    root   /usr/share/nginx/html;
    index  index.html;

    # Path privat diblokir: /private dan /private/...
    # (^~ mengalahkan regex location aset, jadi /private/x.css tetap 403)
    location ^~ /private {
        return 403;
    }

    # Dokumen terpisah dari root website -> demonstrasi alias vs root
    location /docs/ {
        alias   /usr/share/nginx/html/docs/;
        index   index.html;
    }

    # Reverse proxy /api/ dan /app/ -> upstream backend-1/2/3
    # (snippet juga memuat proxy_set_header, timeout, client_max_body_size)
    include /etc/nginx/snippets/proxy-routes.conf;

    # Latihan error proxy (bukan bagian aplikasi):
    #   - tidak ada listener di 127.0.0.1:9090  -> 502 Bad Gateway
    #   - jalankan listener yang menerima koneksi tapi tidak menjawab
    #     (lihat README bagian "Uji 502/504")   -> 504 Gateway Timeout
    location /slow/ {
        # Sengaja TIDAK include proxy-headers.conf: snippet itu sudah memuat
        # proxy_read_timeout 30s, sedangkan location ini butuh 2s agar uji 504
        # cepat selesai. Dua proxy_read_timeout di konteks yang sama membuat
        # nginx -t gagal ("directive is duplicate").
        proxy_pass  http://127.0.0.1:9090/;
        proxy_read_timeout  2s;
    }

    # SPA fallback: file yang tidak ada jatuh ke index.html.
    # Karena itu 404 untuk path halaman TIDAK terjadi — untuk menguji 404
    # gunakan path berekstensi yang tidak ada (lihat scripts/test-routing.sh).
    location / {
        try_files  $uri  $uri/  /index.html;
    }

    # Cache aset statis 30 hari di browser
    location ~* \.(css|js|png|jpg|svg|ico)$ {
        expires  30d;
        # add_header level location tidak mewarisi add_header dari http,
        # jadi snippet security-headers disertakan ulang di sini.
        include  /etc/nginx/snippets/security-headers.conf;
    }
}

# --- HTTPS :8443 --------------------------------------------
server {
    listen       8443 ssl;
    server_name  app.local;

    ssl_certificate      /etc/nginx/certs/server.crt;
    ssl_certificate_key  /etc/nginx/certs/server.key;

    # HSTS hanya boleh dikirim lewat HTTPS
    add_header  Strict-Transport-Security  "max-age=31536000"  always;
    # add_header di server ini membuat add_header dari http tidak diwariskan,
    # jadi security-headers ikut disertakan.
    include  /etc/nginx/snippets/security-headers.conf;

    root   /usr/share/nginx/html;
    index  index.html;

    location ^~ /private {
        return 403;
    }

    location /docs/ {
        alias   /usr/share/nginx/html/docs/;
        index   index.html;
    }

    # /api/ lewat HTTPS dipakai untuk menguji X-Forwarded-Proto: https
    include /etc/nginx/snippets/proxy-routes.conf;

    location / {
        try_files  $uri  $uri/  /index.html;
    }

    location ~* \.(css|js|png|jpg|svg|ico)$ {
        expires  30d;
        include  /etc/nginx/snippets/security-headers.conf;
        add_header  Strict-Transport-Security  "max-age=31536000"  always;
    }
}

# --- Redirect HTTP -> HTTPS (lab) :8081 ---------------------
# Di produksi pakai port 80 -> 443. Di lab memakai 8081 -> 8443
# karena 80/443 butuh hak istimewa.
server {
    listen       8081;
    server_name  app.local;

    return  301  https://localhost:8443$request_uri;
}
