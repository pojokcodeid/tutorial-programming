# ============================================================
# Upstream load balancing + virtual host api.local & docs.local
# (semua listen di port 8080, dipilih lewat header Host)
# ============================================================

# Round-robin (algoritma default) ke tiga container backend.
# Nama host di-resolve saat konfigurasi dimuat, jadi backend harus
# sudah berjalan sebelum `nginx -t` / reload.
upstream app_backend {
    server  backend-1:80;
    server  backend-2:80;
    server  backend-3:80;
}

# --- Virtual host API ---------------------------------------
server {
    listen       8080;
    server_name  api.local;

    default_type  text/plain;

    # Route /api/ dan /app/ (sama dengan app.local)
    include /etc/nginx/snippets/proxy-routes.conf;

    location / {
        return  200  "api.local - virtual host API pada port 8080\n";
    }
}

# --- Virtual host dokumentasi -------------------------------
server {
    listen       8080;
    server_name  docs.local;

    root   /usr/share/nginx/html/docs;
    index  index.html;

    location / {
        try_files  $uri  $uri/  =404;
    }
}
