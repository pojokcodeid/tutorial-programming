# Snippet: header keamanan.
# Di-include di context http (nginx.conf) sehingga diwariskan ke semua
# server block. Perhatikan aturan warisan add_header di nginx.org:
# bila sebuah server/location mendefinisikan add_header sendiri,
# add_header dari context di atasnya TIDAK diwariskan — jadi snippet ini
# harus disertakan ulang di level tersebut (lihat cache location di app.conf).
add_header  X-Content-Type-Options  "nosniff"  always;
add_header  X-Frame-Options  "SAMEORIGIN"  always;
add_header  Referrer-Policy  "strict-origin-when-cross-origin"  always;
add_header  Content-Security-Policy  "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self';"  always;
