# Snippet: route reverse proxy (/api/ dan /app/) ke upstream.
# Di-include di dalam server block (app.local HTTP/HTTPS dan api.local)
# supaya definisinya hanya ditulis satu kali.
#
# proxy_pass diakhiri slash -> prefix /api/ dan /app/ digantikan root "/"
# pada backend. Contoh: /api/headers/  ->  backend menerima /headers/

location /api/ {
    # Zone rate limit didefinisikan di nginx.conf (context http)
    limit_req  zone=gw_rate burst=20 nodelay;

    client_max_body_size  1m;

    include  /etc/nginx/snippets/proxy-headers.conf;

    proxy_pass  http://app_backend/;
}

location /app/ {
    limit_req  zone=gw_rate burst=20 nodelay;

    client_max_body_size  1m;

    include  /etc/nginx/snippets/proxy-headers.conf;

    proxy_pass  http://app_backend/;
}
