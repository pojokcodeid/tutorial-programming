# Snippet: header yang diteruskan ke backend (reverse proxy).
# Dipakai lewat `include` di dalam location proxy.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Dikosongkan agar hop ke backend bebas memakai keep-alive (juga syarat WebSocket).
proxy_set_header Connection        "";

# Timeout backend (pelajaran reverse proxy lanjutan)
# connect timeout sengaja pendek (2s): saat backend mati, IP lama menjawab
# dengan timeout (bukan connection refused), jadi uji 502/504 selesai cepat.
proxy_connect_timeout  2s;
proxy_read_timeout     30s;
proxy_send_timeout     30s;
