# Konfigurasi bersama ketiga container backend.
# Dipasang (bind mount) menimpa /etc/nginx/conf.d/default.conf supaya
# backend memakai konfigurasi yang sama dan punya endpoint /headers/
# untuk membuktikan header yang diteruskan gateway.
server {
    listen       80 default_server;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Mencerminkan request yang diteruskan gateway (dipakai test-proxy.sh)
    location /headers/ {
        default_type  text/plain;
        return 200 "server=$hostname\nhost=$http_host\nx-real-ip=$http_x_real_ip\nx-forwarded-for=$http_x_forwarded_for\nx-forwarded-proto=$http_x_forwarded_proto\n";
    }

    location / {
        try_files  $uri  $uri/  =404;
    }
}
