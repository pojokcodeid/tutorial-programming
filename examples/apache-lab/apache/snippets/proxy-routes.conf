# Snippet: route reverse proxy (/api/ dan /app/) ke load balancer.
# Di-include di dalam virtual host supaya definisinya hanya ditulis
# satu kali untuk dipakai dua vhost (app.local dan api.local).
#
# Tanda "/" di akhir remote URL berguna seperti pada nginx:
#   /api/headers/  ->  backend menerima /headers/
#
# catatan: tidak ada `location` dulu seperti nginx — ProxyPass yang
# berdiri di konteks virtual host memetakan path secara prefiks.
# Urutan: path lebih panjang harus ditulis sebelum path lebih pendek.
# Timeout & connectiontimeout tidak ditulis di sini karena target
# balancer://; keduanya diset per-member di <Proxy balancer://app_backend>
# (lihat httpd.conf).

ProxyPass        "/api/" "balancer://app_backend/"
ProxyPassReverse "/api/" "balancer://app_backend/"

ProxyPass        "/app/" "balancer://app_backend/"
ProxyPassReverse "/app/" "balancer://app_backend/"

# Batas ukuran body: POST > 1 MB ditolak 413 (pengganti
# client_max_body_size pada nginx). Berlaku untuk isi /api/ dan /app/.
<Location "/api/">
    LimitRequestBody 1048576
    Require all granted
</Location>

<Location "/app/">
    Require all granted
</Location>
