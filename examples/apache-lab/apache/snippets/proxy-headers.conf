# Snippet: header yang diteruskan ke backend (reverse proxy).
# Di-include lewat `Include` di DALAM virtual host (Apache tidak punya
# location snippet seperti nginx; potongan dipasang di konteks yang
# diizinkan, yaitu server / virtual host).
#
# catatan: X-Forwarded-For sudah diisi otomatis oleh mod_proxy
# (mod_proxy_http menambahkan IP client). Kita hanya melengkapi
# X-Real-IP dan X-Forwarded-Proto.
ProxyPreserveHost On
RequestHeader set X-Real-IP         "%{REMOTE_ADDR}s"
RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"

# Timeout per rute (dipakai juga untuk uji 502/504):
#   connectiontimeout singkat supaya backend mati cepat ditolak,
#   timeout cukup panjang untuk respons backend normal.
