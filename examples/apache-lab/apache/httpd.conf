# ============================================================
# apache-lab — konfigurasi utama Apache HTTP Server 2.4
# Berbasis konfigurasi bawaan image httpd:2.4
# (/usr/local/apache2/conf/httpd.conf) lalu disesuaikan untuk lab:
#   - Listen pada port non-standar 8080 / 8081 / 8443
#   - modul tambahan aktif (ssl, rewrite, proxy, balancer, dll)
#   - log ke stdout/stderr container (docker/podman friendly)
#   - virtual host di-include dari conf/extra/*.conf
# ============================================================

ServerRoot "/usr/local/apache2"

# Mutex default: logs (dipakai juga oleh pid & mod_ssl)
Mutex default:logs

Listen 8080
Listen 8081
Listen 8443

# ------------------------------------------------------------
# Modul: yang aktif di bawah ini adalah modul bawaan image +
# modul tambahan yang dipakai materi ini.
# Urutan LoadModule mengikuti dependensi (mis. proxy -> proxy_http).
# ------------------------------------------------------------

# --- MPM (Multi-Processing Module) ---------------------------
# mpm_event: worker MPM bawaan (threaded). Alternatif: mpm_prefork
# (wajib kalau memuat mod_php) dan mpm_worker.
LoadModule mpm_event_module modules/mod_mpm_event.so

# --- Autentikasi & otorisasi --------------------------------
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule authz_groupfile_module modules/mod_authz_groupfile.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule auth_digest_module modules/mod_auth_digest.so
LoadModule access_compat_module modules/mod_access_compat.so

# --- Request & filter ---------------------------------------
LoadModule reqtimeout_module modules/mod_reqtimeout.so
LoadModule filter_module modules/mod_filter.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule version_module modules/mod_version.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule status_module modules/mod_status.so
LoadModule autoindex_module modules/mod_autoindex.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so

# --- Modul tambahan untuk materi Apache ---------------------
# (komentar sengaja di baris terpisah — Apache memakai seluruh baris
# sebagai argumen direktif, jadi `LoadModule ... # teks` akan error)
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule expires_module modules/mod_expires.so
LoadModule ratelimit_module modules/mod_ratelimit.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule http2_module modules/mod_http2.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_balancer_module modules/mod_proxy_balancer.so
LoadModule lbmethod_byrequests_module modules/mod_lbmethod_byrequests.so
LoadModule lbmethod_bytraffic_module modules/mod_lbmethod_bytraffic.so
LoadModule slotmem_shm_module modules/mod_slotmem_shm.so
LoadModule info_module modules/mod_info.so

<IfModule unixd_module>
    # Proses worker berjalan sebagai user ini (bawaan image).
    User www-data
    Group www-data
</IfModule>

# ------------------------------------------------------------
# ServerAdmin & ServerName
# ------------------------------------------------------------
ServerAdmin you@example.com
# ServerName eksplisit supaya tidak ada peringatan "Could not reliably
# determine the server's fully qualified domain name".
ServerName localhost:8080

# ------------------------------------------------------------
# Root dokumen & proteksi direktori
# ------------------------------------------------------------
<Directory />
    AllowOverride none
    Require all denied
</Directory>

DocumentRoot "/usr/local/apache2/htdocs"
<Directory "/usr/local/apache2/htdocs">
    Options Indexes FollowSymLinks
    # All = semua direktori boleh pakai .htaccess (dipakai latihan .htaccess)
    AllowOverride All
    Require all granted
</Directory>

# Cache aset statis 30 hari di browser (mod_expires).
# Hanya untuk direktori assets, agar respons lain tidak ikut
# terdampak (proxy & HTML selalu segar).
<Directory "/usr/local/apache2/htdocs/assets">
    ExpiresActive On
    ExpiresDefault "access plus 30 days"
</Directory>

DirectoryIndex index.html

# Reverse proxy: pastikan Apache TIDAK menjadi forward proxy terbuka
ProxyRequests Off
# Hanya backend internal yang boleh dipakai (keamanan dasar)
ProxyVia Off

# --- Load balancer ------------------------------------------
# Definisi ini ditulis sekali di server context, lalu dipakai oleh
# route /api/ dan /app/ lewat balancer://app_backend
# (lihat conf/snippets/proxy-routes.conf).
# timeout         -> batas menunggu respons backend
# connectiontimeout -> batas koneksi ke backend (2 detik supaya
#                     backend mati cepat ditolak saat uji 502)
<Proxy "balancer://app_backend">
    BalancerMember "http://backend-1:80" route=backend-1 connectiontimeout=2 timeout=15
    BalancerMember "http://backend-2:80" route=backend-2 connectiontimeout=2 timeout=15
    BalancerMember "http://backend-3:80" route=backend-3 connectiontimeout=2 timeout=15
    # byrequests = round-robin (algoritma default)
    ProxySet lbmethod=byrequests
</Proxy>

# Timeout koneksi ke backend; rute /api/, /app/ dan /slow/
# memakai nilai sendiri lewat atribut ProxyPass.
ProxyTimeout 15

# Session cache TLS (mod_ssl) — tanpa ini muncul peringatan
# "AH01873: Init: Session Cache is not configured".
SSLSessionCache "shmcb:/usr/local/apache2/logs/ssl_scache(512000)"

# ------------------------------------------------------------
# Log: ke stdout / stderr container supaya `podman logs` berfungsi
# ------------------------------------------------------------
ErrorLog /proc/self/fd/2

# Level: emerg | alert | crit | error | warn | notice | info | debug
LogLevel warn

# Format akses "main" — lengkap untuk troubleshooting,
# termasuk waktu proses & status upstream.
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\" rt=%T" main
LogFormat "%h %l %u %t \"%r\" %>s %b" common
LogFormat "%{X-Forwarded-For}i %h %l %u %t \"%r\" %>s %b" combined-proxy

CustomLog /proc/self/fd/1 main

# ------------------------------------------------------------
# Perilaku umum
# ------------------------------------------------------------
HostnameLookups Off
AddDefaultCharset UTF-8
EnableSendfile On

# Batas default (dipengaruhi mod_reqtimeout)
Timeout 60
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5

# Keamanan dasar global
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# ------------------------------------------------------------
# MIME types & kompresi global
# ------------------------------------------------------------
TypesConfig conf/mime.types
AddType application/javascript .js
AddType application/json .json
AddType image/svg+xml .svg

# Kompresi teks (mod_deflate)
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/css
    AddOutputFilterByType DEFLATE application/javascript application/json
    AddOutputFilterByType DEFLATE image/svg+xml
</IfModule>

# ------------------------------------------------------------
# Virtual host lab. Snippet (potongan pakai ulang) di-include
# DI DALAM vhost masing-masing, sama seperti pola nginx.
# ------------------------------------------------------------
Include conf/extra/app.conf
Include conf/extra/api.conf
Include conf/extra/docs.conf
Include conf/extra/status.conf
