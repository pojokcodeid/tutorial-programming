# ============================================================
# Monitoring: /server-status (mod_status) & /server-info (mod_info)
# Berguna untuk pelajaran logging & monitoring.
#
# PERINGATAN PRODUKSI: jangan pernah membiarkan endpoint ini terbuka
# untuk publik. Ganti `Require all granted` dengan mis.:
#     Require ip 10.0.0.0/8
#     Require ip 127.0.0.1
# atau tutup dengan autentikasi basic auth.
# ============================================================

<Location "/server-status">
    SetHandler server-status
    Require all granted
</Location>

# Tambahkan `?auto` pada URL untuk output ringkas:
#   curl http://localhost:8080/server-status?auto

<Location "/server-info">
    SetHandler server-info
    Require all granted
</Location>
