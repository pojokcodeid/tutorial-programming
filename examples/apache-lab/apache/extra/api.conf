# ============================================================
# Virtual host API: api.local (semua di port 8080, dipilih lewat
# header Host — seperti server_name pada nginx)
# ============================================================

<VirtualHost *:8080>
    ServerName api.local
    ServerAdmin admin@api.local

    # Dokumen pembungkus: DirectoryIndex menunjuk berkas khusus,
    # jadi "/" membalas identitas vhost ini.
    DocumentRoot "/usr/local/apache2/htdocs"
    DirectoryIndex api.html

    Include conf/snippets/security-headers.conf

    # Route /api/ dan /app/ (sama dengan app.local)
    Include conf/snippets/proxy-routes.conf
    Include conf/snippets/proxy-headers.conf

    # Sisa path dilayani dari DocumentRoot (tanpa SPA fallback —
    # vhost API mengembalikan 404 untuk path yang tidak dikenal).
    <Directory "/usr/local/apache2/htdocs">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
