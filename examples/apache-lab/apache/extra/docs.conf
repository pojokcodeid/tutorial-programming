# ============================================================
# Virtual host dokumentasi: docs.local (port 8080)
# Dokumen disajikan lewat Alias, bukan dari DocumentRoot.
# ============================================================

<VirtualHost *:8080>
    ServerName docs.local
    ServerAdmin admin@docs.local

    # DocumentRoot tetap dibutuhkan sebagai "pemilik" vhost ini
    DocumentRoot "/usr/local/apache2/htdocs"
    DirectoryIndex index.html

    Include conf/snippets/security-headers.conf

    Alias "/" "/usr/local/apache2/docs/"
    <Directory "/usr/local/apache2/docs">
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
