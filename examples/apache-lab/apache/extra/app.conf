# ============================================================
# Virtual host utama: app.local (website statis + SPA fallback)
#   server 1: *:8080  (HTTP — juga default vhost, seperti
#                     `default_server` pada nginx)
#   server 2: *:8443  (HTTPS)
#   server 3: *:8081  (hanya redirect ke HTTPS, khusus lab)
# Route di dua server pertama sengaja ditulis sama agar mudah
# dibandingkan; pola aslinya di produksi: 80 -> 443.
# ============================================================

# --- HTTP :8080 ---------------------------------------------
# urutan include menentukan default vhost: blok pertama untuk satu
# port adalah tempat jatuhnya request dengan Host yang tidak cocok.
<VirtualHost *:8080>
    ServerName app.local
    ServerAdmin admin@app.local

    DocumentRoot "/usr/local/apache2/htdocs"
    DirectoryIndex index.html

    Include conf/snippets/security-headers.conf

    # --- Blokir path privat -------------------------------------
    # <Location> cocok terhadap URL, jadi tetap 403 walau file tidak ada
    # (dibaca dari konfigurasi, bukan dari disk).
    <Location "/private">
        Require all denied
    </Location>

    # --- Dokumen terpisah dari DocumentRoot (demonstrasi Alias) ---
    Alias "/docs/" "/usr/local/apache2/docs/"
    <Directory "/usr/local/apache2/docs">
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # --- Reverse proxy /api/ dan /app/ -> load balancer ---------
    Include conf/snippets/proxy-routes.conf
    Include conf/snippets/proxy-headers.conf

    # --- Latihan error proxy (bukan bagian aplikasi) ------------
    #   - tidak ada listener di backend-1:9090 -> 502 Bad Gateway
    #   - listener yang menerima koneksi tapi tidak menjawab
    #     (lihat README bagian "Uji 502/504") -> 504 Gateway Timeout
    # Sengaja TIDAK include proxy-headers.conf: snippet itu tidak
    # memuat timeout, sedangkan location ini butuh 3 detik agar uji
    # 504 cepat selesai.
    ProxyPass        "/slow/" "http://backend-1:9090/" connectiontimeout=2 timeout=3
    ProxyPassReverse "/slow/" "http://backend-1:9090/"
    <Location "/slow/">
        Require all granted
    </Location>

    # --- SPA fallback -------------------------------------------
    # File/direktori yang tidak ada dan TANPA ekstensi jatuh ke
    # index.html (pengganti try_files ... /index.html).
    # Request berekstensi TIDAK ikut fallback supaya aset yang hilang
    # tetap 404 (lihat scripts/test-routing.sh).
    RewriteEngine On
    RewriteCond %{REQUEST_URI}    !^/(api|app|slow|docs)/
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule  !\.[a-zA-Z0-9]+$ /index.html [L]
</VirtualHost>

# --- HTTPS :8443 --------------------------------------------
<VirtualHost *:8443>
    ServerName app.local
    ServerAdmin admin@app.local

    DocumentRoot "/usr/local/apache2/htdocs"
    DirectoryIndex index.html

    SSLEngine on
    SSLCertificateFile    "/usr/local/apache2/certs/server.crt"
    SSLCertificateKeyFile "/usr/local/apache2/certs/server.key"

    # TLS 1.2 + 1.3 saja; HTTP/2 via ALPN (mod_http2)
    SSLProtocol           all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite        HIGH:!aNULL:!MD5
    SSLHonorCipherOrder   on
    Protocols h2 http/1.1

    Include conf/snippets/security-headers.conf
    # HSTS hanya boleh dikirim lewat HTTPS
    Header always set Strict-Transport-Security "max-age=31536000"

    <Location "/private">
        Require all denied
    </Location>

    Alias "/docs/" "/usr/local/apache2/docs/"
    <Directory "/usr/local/apache2/docs">
        Options Indexes FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # /api/ lewat HTTPS dipakai untuk menguji X-Forwarded-Proto: https
    Include conf/snippets/proxy-routes.conf
    Include conf/snippets/proxy-headers.conf

    RewriteEngine On
    RewriteCond %{REQUEST_URI}    !^/(api|app|slow|docs)/
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule  !\.[a-zA-Z0-9]+$ /index.html [L]
</VirtualHost>

# --- Redirect HTTP -> HTTPS (lab) :8081 ---------------------
# Di produksi pakai port 80 -> 443. Di lab memakai 8081 -> 8443
# karena 80/443 butuh hak istimewa.
<VirtualHost *:8081>
    ServerName app.local

    # mod_alias: path setelah "/" disisipkan ke URL tujuan
    Redirect permanent "/" "https://localhost:8443/"
</VirtualHost>
