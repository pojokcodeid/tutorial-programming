# apache-lab — gateway Apache HTTP Server + 3 backend statis
# Jalankan dari folder ini:
#   bash scripts/gen-certs.sh
#   podman compose up -d     (atau: podman-compose up -d)
#
# Hanya memakai gambar resmi docker.io/library/httpd:2.4
# dan docker.io/library/nginx:alpine (sebagai backend).
#
# Port non-standar (8080/8081/8443) supaya container tetap jalan
# tanpa hak istimewa — container bebas membuka port >1024.
services:
  apache-lab:
    image: docker.io/library/httpd:2.4
    container_name: apache-lab
    ports:
      - "8080:8080"   # HTTP gateway (default vhost app.local)
      - "8081:8081"   # redirect HTTP -> HTTPS (lab)
      - "8443:8443"   # HTTPS gateway
    volumes:
      - ./apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
      - ./apache/extra:/usr/local/apache2/conf/extra:ro
      - ./apache/snippets:/usr/local/apache2/conf/snippets:ro
      - ./web:/usr/local/apache2/htdocs:ro
      - ./docs:/usr/local/apache2/docs:ro
      - ./certs:/usr/local/apache2/certs:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3

  backend-1:
    image: docker.io/library/nginx:alpine
    container_name: backend-1
    hostname: backend-1
    volumes:
      - ./backends/backend-1:/usr/share/nginx/html:ro
      - ./backends/backend.conf:/etc/nginx/conf.d/default.conf:ro

  backend-2:
    image: docker.io/library/nginx:alpine
    container_name: backend-2
    hostname: backend-2
    volumes:
      - ./backends/backend-2:/usr/share/nginx/html:ro
      - ./backends/backend.conf:/etc/nginx/conf.d/default.conf:ro

  backend-3:
    image: docker.io/library/nginx:alpine
    container_name: backend-3
    hostname: backend-3
    volumes:
      - ./backends/backend-3:/usr/share/nginx/html:ro
      - ./backends/backend.conf:/etc/nginx/conf.d/default.conf:ro
