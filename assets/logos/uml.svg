<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="UML">
  <!-- Logo UML: motif diagram kelas (tiga kotak terhubung) — ungu #7C3AED -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="#7C3AED"/>
  <!-- kotak induk (atas) -->
  <rect x="22" y="11" width="20" height="13" rx="2.5" fill="#ffffff"/>
  <!-- garis penghubung -->
  <path d="M32 24 V31 M16 31 H48 M16 31 V36 M48 31 V36" stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <!-- dua kotak anak (bawah) -->
  <rect x="7" y="36" width="18" height="15" rx="2.5" fill="#ffffff" opacity="0.92"/>
  <rect x="39" y="36" width="18" height="15" rx="2.5" fill="#ffffff" opacity="0.92"/>
  <!-- garis pemisah dalam kotak -->
  <path d="M7 41 H25 M39 41 H57" stroke="#7C3AED" stroke-width="1.6"/>
</svg>
