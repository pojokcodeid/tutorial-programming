<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Docker">
  <!-- Logo Docker: Moby Dock whale resmi -->
  <rect width="64" height="64" rx="10" fill="#2496ED"/>
  <g fill="#ffffff">
    <!-- Badan paus (Moby Dock) - bentuk organik khas Docker -->
    <path d="M12 36 C12 28 18 22 28 20 C34 18 40 18 46 22 C52 26 54 34 54 42 C54 50 48 56 40 58 C32 60 24 58 16 54 C10 50 8 44 8 36 C8 30 12 36 12 36 Z" fill="#ffffff"/>
    <!-- Ekor paus (fluke) -->
    <path d="M12 36 C6 36 2 32 2 28 C2 24 6 20 12 20 C12 24 10 28 10 30 C10 32 12 36 12 36 Z" fill="#ffffff"/>
    <!-- Sirip punggung (dorsal fin) kecil -->
    <path d="M34 18 C36 16 40 16 42 18 C41 20 38 21 34 21 C33 20 33 19 34 18 Z" fill="#ffffff"/>
    <!-- Mata paus -->
    <circle cx="44" cy="30" r="2.5" fill="#ffffff"/>
    <!-- Container di punggung paus (3 container bertumpuk khas Docker) -->
    <!-- Container 1 (bawah) -->
    <rect x="30" y="28" width="20" height="9" rx="1" fill="#ffffff"/>
    <rect x="32" y="30" width="5" height="5" rx="0.5" fill="#2496ED"/>
    <rect x="39" y="30" width="5" height="5" rx="0.5" fill="#2496ED"/>
    <rect x="46" y="30" width="3" height="5" rx="0.5" fill="#2496ED"/>
    <!-- Container 2 (tengah) -->
    <rect x="29" y="19" width="20" height="9" rx="1" fill="#ffffff"/>
    <rect x="31" y="21" width="5" height="5" rx="0.5" fill="#2496ED"/>
    <rect x="38" y="21" width="5" height="5" rx="0.5" fill="#2496ED"/>
    <rect x="45" y="21" width="3" height="5" rx="0.5" fill="#2496ED"/>
    <!-- Container 3 (atas) -->
    <rect x="28" y="10" width="20" height="9" rx="1" fill="#ffffff"/>
    <rect x="30" y="12" width="5" height="5" rx="0.5" fill="#2496ED"/>
    <rect x="37" y="12" width="5" height="5" rx="0.5" fill="#2496ED"/>
    <rect x="44" y="12" width="3" height="5" rx="0.5" fill="#2496ED"/>
  </g>
</svg>